<body class="dim">
  <!-- Signing on happens on the main DialedUp page; this shows only while checking -->
  <main id="signon" class="screen">
    <div class="signon-box glossy dim-signon">
      <div class="dim-logo"><img src="img/dim-logo.png" alt=""><div><b>Instantly</b><small>by DialedUp</small></div></div>
      <p class="small muted" style="text-align:center">Connecting…</p>
    </div>
  </main>

  <div id="app" hidden>
    <div id="desk"></div>
    <footer id="taskbar" class="glossy">
      <button id="start" class="start"><img src="img/dim-logo.png" alt="">Instantly</button>
      <div id="taskbar-windows"></div>
      <button class="btn small-btn has-badge dim-bell" data-bell title="Notifications">🔔<b class="badge" hidden></b></button>
      <button class="btn small-btn fs-btn switch-tab" hidden>⛶ Full Screen</button>
      <button id="to-du" class="btn small-btn switch-tab" title="Switch to DialedUp">🌐 <span class="long">Switch to DialedUp</span><span class="short">DialedUp</span></button>
      <span id="clock"></span>
    </footer>
  </div>

  <script type="module" src="js/dim.js?v=1795049785"></script>
