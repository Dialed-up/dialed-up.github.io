name: DNS check
on: workflow_dispatch
permissions: {}
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Look up dialedup.lol
        run: |
          for t in A AAAA NS; do echo "== dialedup.lol $t"; dig +short dialedup.lol $t @1.1.1.1; done
          echo "== www.dialedup.lol"; dig +short www.dialedup.lol @1.1.1.1
          echo "== whois status"; whois dialedup.lol 2>/dev/null | grep -iE "status|registrar:|name server|creation" | head -12 || true
      - name: Check the site
        run: |
          echo "== http://dialedup.lol"; curl -sI -m 15 http://dialedup.lol | grep -iE "^HTTP|^location" || true
          echo "== https://dialedup.lol"; curl -sI -m 15 https://dialedup.lol | grep -iE "^HTTP|^location" || echo "(https not ready yet)"
          echo "== https://dialed-up.github.io"; curl -sI -m 15 https://dialed-up.github.io | grep -iE "^HTTP|^location" || true
          echo "== page title"; curl -sL -m 15 http://dialedup.lol | grep -o "<title>[^<]*" | head -1 || true
