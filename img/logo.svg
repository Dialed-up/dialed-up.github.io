<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- An original nod to the era: the free-trial CD-ROM that showed up in every mailbox -->
  <defs>
    <radialGradient id="disc" cx="50%" cy="50%" r="50%">
      <stop offset=".18" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#e0d4ff"/>
      <stop offset=".55" stop-color="#ffc2ef"/>
      <stop offset=".72" stop-color="#b8f2ff"/>
      <stop offset=".88" stop-color="#d9c2ff"/>
      <stop offset="1" stop-color="#9c7fd6"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="label" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5ec4"/><stop offset=".55" stop-color="#8a4dff"/><stop offset="1" stop-color="#21d4fd"/>
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="47" fill="url(#disc)" stroke="#7a4ad8" stroke-width="2"/>
  <circle cx="50" cy="50" r="47" fill="url(#shine)"/>
  <!-- printed label band across the disc -->
  <path d="M8 38 A47 47 0 0 1 92 38 L92 62 A47 47 0 0 1 8 62 Z" fill="url(#label)" opacity=".95"/>
  <!-- phone handset -->
  <path d="M19 55c-3-3-3-7 0-10l4-4 6 6-3 3c1.5 3 4 5.5 7 7l3-3 6 6-4 4c-3 3-7 3-10 0z" fill="#fff"/>
  <text x="62" y="47" text-anchor="middle" font-family="Verdana, sans-serif" font-weight="900" font-size="15" fill="#ffe94d">∞</text>
  <text x="62" y="57" text-anchor="middle" font-family="Verdana, sans-serif" font-weight="900" font-size="6.5" fill="#fff">FREE HOURS!</text>
  <!-- center hole -->
  <circle cx="50" cy="50" r="7" fill="#fff" stroke="#9c7fd6" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="3" fill="#5b2a86"/>
</svg>
